<title>Puppy Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D town, floating candy-colored HUD chips, bottom-sheet dialogs. Single sunny look by choice. */
:root{
  --sky:#bfe6ff; --ink:#2a2140; --paper:#fffaf2; --grape:#7b4fd6; --sun:#ffc53d; --mint:#2fbf8f; --berry:#ff5d8f;
  --lilac:#ece4f7; --shade:rgba(42,33,64,.2);
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.chip{pointer-events:auto;background:var(--paper);border-radius:999px;box-shadow:0 3px 0 var(--shade);padding:8px 14px;font-weight:800}
#coins{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;flex:none}
#coins svg{width:26px;height:26px;flex:none}
#goal{flex:1;min-width:0;max-width:420px;border-radius:18px;padding:8px 14px;font-size:14px;line-height:1.3}
#goal b{font-family:var(--display);font-weight:400;color:var(--grape);display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#goal small{display:block;color:#6a5f80;font-weight:600;margin-top:2px}
#goal{position:relative;cursor:pointer;padding-right:40px}
#goal::after{content:"\2212";position:absolute;right:8px;top:7px;width:24px;height:24px;border-radius:50%;background:#efe6fb;color:var(--grape);display:grid;place-items:center;font:400 20px/1 var(--display)}
#goal.min{flex:none;padding-right:40px}#goal.min::after{content:"+"}#goal.min #goalT,#goal.min #goalQ{display:none}
#goal.min.new::after{background:var(--sun);color:var(--ink);animation:gnew 1s ease-in-out infinite}
@keyframes gnew{50%{transform:scale(1.18)}}
#menuBtn{flex:none;margin-left:auto;width:46px;height:46px;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
#menuBtn span,#menuBtn span::before,#menuBtn span::after{display:block;width:18px;height:3px;border-radius:2px;background:var(--ink);position:relative;content:""}
#menuBtn span::before{position:absolute;top:-6px}#menuBtn span::after{position:absolute;top:6px}
#joy{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
  background:rgba(255,250,242,.35);border:3px solid rgba(255,250,242,.85);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--shade)}
#act{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;border:0;
  background:var(--sun);font-family:var(--display);font-size:22px;color:var(--ink);box-shadow:0 6px 0 #d99a10;cursor:pointer;animation:pop .25s ease-out}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 #d99a10}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font-weight:800;
  padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;transition:opacity .3s}
#toast.off{opacity:0}
.wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(42,33,64,.35);
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
@media (min-width:700px) and (min-height:560px){.wrap{align-items:center}}
/* Rows size to their content, so the 3D preview box can't collapse and cover the rows below it on tall phone screens */
@media (min-height:501px){.sheet{grid-auto-rows:max-content}}
.sheet{background:var(--paper);border-radius:26px;max-width:440px;width:100%;box-sizing:border-box;padding:22px 20px 20px;box-shadow:0 6px 0 var(--shade);max-height:100%;overflow:auto;display:grid;gap:12px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:0;color:var(--grape);text-wrap:balance}
.sheet p{margin:0;font-size:16px;line-height:1.45}
.tag{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8a7fa3}
.card{border:3px solid var(--lilac);border-radius:18px;padding:14px;display:grid;gap:6px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.price{font-family:var(--display);font-size:20px;color:#b7791f;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:19px;border:0;border-radius:16px;padding:12px 20px;background:var(--mint);color:#fff;box-shadow:0 4px 0 #1f8f69;cursor:pointer}
.btn.alt{background:var(--lilac);color:var(--ink);box-shadow:0 4px 0 #cbbde3}
.btn.warn{background:var(--berry);box-shadow:0 4px 0 #c93a69}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn:focus-visible,#act:focus-visible,#menuBtn:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-weight:800}
.checks li::before{content:"○ ";color:#b5aac8}.checks li.ok::before{content:"✓ ";color:var(--mint)}
input[type=text]{font:800 20px var(--body);padding:10px 14px;border-radius:14px;border:3px solid var(--lilac);background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text;width:100%;box-sizing:border-box}
input[type=text]:focus{outline:none;border-color:var(--grape)}
.keys{font-size:13px;color:#6a5f80}
.in-title .hud,.in-title #joy,.in-title #act{display:none!important}
.lefty #joy{left:auto;right:calc(20px + env(safe-area-inset-right,0px))}
.lefty #act{right:auto;left:calc(22px + env(safe-area-inset-left,0px))}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 7vh) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(to bottom,rgba(191,230,255,.15) 0%,rgba(191,230,255,0) 35%,rgba(42,33,64,.55) 100%)}
.logo{text-align:center;transform:rotate(-3deg);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-3deg) translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.logo,#act{animation:none}}
.kicker{display:inline-block;font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:var(--berry);color:#fff;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 #c93a69}
.logo h1{margin:10px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(64px,19vw,112px);line-height:.88;color:var(--sun);
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
.byline{margin:14px 0 0;font-weight:800;color:var(--ink);background:var(--paper);display:inline-block;padding:4px 12px;border-radius:999px}
.tmenu{width:100%;max-width:340px;display:grid;gap:12px}
.tmenu .btn{width:100%;font-size:22px;padding:14px 20px}
.tmenu .row .btn{flex:1;font-size:17px;padding:11px 12px;width:auto}
#tInfo{margin:0;text-align:center;color:var(--paper);font-weight:800;font-size:14px;min-height:1em}
.slots{display:grid;gap:10px}
.slot{border:3px solid var(--lilac);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sl-main{min-width:0;flex:1 1 160px}.sl-line{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.slot .btn{font-size:16px;padding:9px 14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:17px}
.set .btn{min-width:96px;font-size:17px;padding:9px 14px}
.hud .col{display:grid;gap:8px;flex:none;justify-items:start}.hud .col.r{justify-items:end;margin-left:auto}
#boxBtn{border:0;font-family:var(--display);font-size:15px;color:var(--grape);cursor:pointer;padding:7px 12px}
#fsBtn{width:46px;height:46px;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
#fsBtn svg,#fsBtn2 svg{width:22px;height:22px}
#fsBtn2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(16px + env(safe-area-inset-right,0px));width:46px;height:46px;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
#look{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;
  background:rgba(123,79,214,.18);border:3px dashed rgba(255,250,242,.9);touch-action:none}
#look .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--shade);display:grid;place-items:center}
#look .knob svg{width:26px;height:26px}
#act{bottom:calc(152px + env(safe-area-inset-bottom,0px));width:92px;height:92px;font-size:20px}
.lefty #look{right:auto;left:calc(20px + env(safe-area-inset-left,0px))}
.in-title #look{display:none!important}
#mini{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 122px);width:112px;height:112px;border-radius:18px;border:3px solid var(--paper);box-shadow:0 3px 0 var(--shade);background:#8fd16a;touch-action:manipulation;cursor:pointer;transition:width .2s,height .2s}
#mini.big{width:224px;height:224px}.in-title #mini{display:none!important}
@media (max-height:500px){#mini{top:calc(env(safe-area-inset-top,0px) + 112px);width:96px;height:96px}#mini.big{width:200px;height:200px}}
.pvbox{position:relative;border-radius:20px;background:linear-gradient(#f6f0ff,#e6dcf6);overflow:hidden;aspect-ratio:1.5;max-height:34vh;max-width:100%;justify-self:center;width:100%}
.pvbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pvbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 3px 0 var(--shade);
  font-family:var(--display);font-size:24px;color:var(--grape);cursor:pointer;display:grid;place-items:center;padding:0}
.pvbox .nav.l{left:10px}.pvbox .nav.r{right:10px}
.pvbox .count{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--grape);background:var(--paper);padding:3px 10px;border-radius:999px}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2,.tab{font:800 14px var(--body);border:2px solid var(--lilac);background:#fff;border-radius:999px;padding:7px 11px;color:var(--ink);cursor:pointer}
.tab{font-family:var(--display);font-weight:400;font-size:15px}
.chip2.on,.tab.on{background:var(--grape);color:#fff;border-color:var(--grape)}
.wr{display:grid;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--lilac);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--grape)}
.toy .row{justify-content:center;gap:6px}
.owned{font-family:var(--display);font-size:15px;color:#fff;background:var(--mint);padding:4px 10px;border-radius:999px;justify-self:start}
.box{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.toy{border:3px solid var(--lilac);border-radius:18px;padding:8px;display:grid;gap:4px;text-align:center}
.toy.out{border-color:var(--mint)}
.toy img{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:12px;background:#f1eafb}
.toy b{font-family:var(--display);font-weight:400;font-size:18px;overflow-wrap:anywhere}
.toy small{color:#6a5f80;font-weight:800;font-size:12px}
.toy .btn{font-size:15px;padding:8px 10px}
@media (max-height:500px){
  .hud{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
  #goal{font-size:12px;max-width:340px;padding:6px 36px 6px 12px}#goal::after{top:5px;right:6px;width:22px;height:22px;font-size:18px}#goal b{font-size:11px}
  #coins{font-size:19px}#joy{width:112px;height:112px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}#knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  #look{width:100px;height:100px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #act{width:78px;height:78px;font-size:17px;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(136px + env(safe-area-inset-right,0px))}
  .lefty #act{right:auto;left:calc(136px + env(safe-area-inset-left,0px))}
  #toast{top:calc(env(safe-area-inset-top,0px) + 64px)}
  .wrap{align-items:center;padding-block:8px}.sheet{max-width:560px;padding:14px 16px;gap:8px}.sheet h2{font-size:24px}
  #title{flex-direction:row;justify-content:space-around;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .sheet.shop{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.sheet.shop>*{grid-column:1/-1}
  .sheet.shop .pvbox{grid-column:1;grid-row:3/span 3;max-height:none}.sheet.shop.gear .pvbox{grid-row:4/span 3}.sheet.dress{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start}.sheet.dress>*{grid-column:2}.sheet.dress .pvbox{grid-column:1;grid-row:1/span 9;max-height:none;position:sticky;top:0}.sheet.shop .card p{font-size:14px;line-height:1.35}.sheet.shop .card{padding:10px 12px}.sheet.shop .card,.sheet.shop>p,.sheet.shop>.row{grid-column:2}
  .logo h1{font-size:clamp(48px,17vh,96px)}.tmenu{gap:8px}.tmenu .btn{font-size:18px;padding:10px 16px}
}
/* fetch ball button, sticker pop-up and sticker book */
#ballBtn{position:fixed;right:calc(126px + env(safe-area-inset-right,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;padding:0;
  background:var(--paper);box-shadow:0 4px 0 var(--shade);display:grid;place-items:center;cursor:pointer;animation:pop .25s ease-out}
#ballBtn svg{width:40px;height:40px}
#ballBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.lefty #ballBtn{right:auto;left:calc(126px + env(safe-area-inset-left,0px))}
.in-title #ballBtn{display:none!important}
#stkPop{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);background:var(--paper);border:3px solid var(--sun);border-radius:20px;
  padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 var(--shade);pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100% - 32px);box-sizing:border-box}
#stkPop.off{opacity:0;transform:translate(-50%,-10px) scale(.9)}
#stkPop .ic{font-size:30px;width:48px;height:48px;flex:none;display:grid;place-items:center;background:#fff4d1;border-radius:50%}
#stkPop b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--grape)}
#stkPop small{font-weight:800;color:#b7791f}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stk{border:3px solid var(--lilac);border-radius:16px;padding:8px 6px;text-align:center;display:grid;gap:3px;justify-items:center;align-content:start}
.stk .ic{font-size:32px;line-height:1.15}
.stk b{font-family:var(--display);font-weight:400;font-size:14px;line-height:1.1}
.stk small{font-size:11px;color:#6a5f80;font-weight:800;line-height:1.25}
.stk.on{border-color:var(--sun);background:#fffbe9}
.stk:not(.on) .ic{filter:grayscale(1);opacity:.35}
.meter{height:12px;border-radius:999px;background:var(--lilac);overflow:hidden}.meter i{display:block;height:100%;background:var(--sun);border-radius:999px}
/* trick show buttons */
.trks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trk{font-family:var(--display);font-size:19px;border:0;border-radius:16px;padding:12px 8px;background:var(--lilac);color:var(--ink);box-shadow:0 4px 0 #cbbde3;cursor:pointer;transition:transform .12s,background .12s}
.trk:disabled{cursor:default}
.trk.lit{background:var(--sun);box-shadow:0 4px 0 #d99a10;transform:scale(1.06)}
.trk.bad{background:var(--berry);color:#fff}
#tsMsg{min-height:1.05em}
@media (max-height:500px){
  .sheet.shop>.trks{grid-column:2}.trk{padding:8px;font-size:16px}
  #ballBtn{width:56px;height:56px;bottom:calc(26px + env(safe-area-inset-bottom,0px));right:calc(226px + env(safe-area-inset-right,0px))}
  .lefty #ballBtn{right:auto;left:calc(226px + env(safe-area-inset-left,0px))}
  #stkPop{top:calc(env(safe-area-inset-top,0px) + 110px)}
}
/* care, bedtime, photo mode, park games */
.fxl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fxl span{position:absolute;bottom:18%;font-size:30px;animation:fxup 1s ease-out forwards}
@keyframes fxup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.25);opacity:0}}
p.hearts{font-size:28px;line-height:1;color:var(--berry);letter-spacing:3px;text-align:center;margin:0}
.trk small{display:block;font-family:var(--body);font-size:12px;font-weight:800;opacity:.75}
.hbtn{border:0;background:#fff0f5;color:var(--berry);border-radius:999px;font:800 13px var(--body);padding:5px 10px;cursor:pointer;justify-self:center}
.hbtn span{letter-spacing:1px}
#camBtn{border:0;font-family:var(--display);font-size:15px;color:var(--grape);cursor:pointer;padding:7px 12px}
#sleep{position:fixed;inset:0;z-index:6;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#3a3a7a,#151536);color:var(--paper);
  opacity:0;pointer-events:none;transition:opacity .9s;padding:24px}
#sleep.on{opacity:1;pointer-events:auto}
#sleep b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,40px);max-width:16em}
#sleep small{display:block;font-weight:800;opacity:.75;margin-top:6px}
#sleep .zz{font-size:56px;animation:zz 1.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-10px) rotate(-8deg)}}
.photo .hud,.photo #joy,.photo #look,.photo #act,.photo #ballBtn,.photo #mini,.photo #pgBar{display:none!important}
#photoUi .pbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
#photoUi .ptop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#photoUi .ptop .chip{border:0;font-family:var(--display);font-size:16px;color:var(--grape);cursor:pointer;padding:9px 16px}
.pb{width:54px;height:54px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 3px 0 var(--shade);font:400 26px var(--display);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pb.snap{width:78px;height:78px;background:#fff;border:6px solid var(--berry);box-shadow:0 4px 0 var(--shade)}
.pb:active{transform:translateY(3px)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.photoImg{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;box-shadow:0 3px 0 var(--shade);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.pg #goal{visibility:hidden}
#pgBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;
  font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
#pgBar button{border:0;border-radius:999px;background:var(--lilac);font:800 14px var(--body);padding:6px 12px;cursor:pointer;color:var(--ink)}

function ballReset(){if(ball.dog)ball.dog.fetching=false;ball.ph=null;ball.dog=null;if(ball.m)ball.m.visible=false;}

function throwBall(){if(!canThrow())return;audio();const P=player.position,a=player.rotation.y,dist=11+Math.random()*4;
  const to={x:P.x+Math.sin(a)*dist,z:P.z+Math.cos(a)*dist};collide(to,.5);
  ball.a.set(P.x+Math.sin(a)*.6,1.5,P.z+Math.cos(a)*.6);ball.b.set(to.x,.24,to.z);ball.t=0;ball.ph='fly';
  const free=dogsW.filter(d=>!d.sniff),list=free.length?free:dogsW,d=list[ball.turn++%list.length];d.sniff=null;d.fetching=true;d.fetchT=0;ball.dog=d;
  ball.m.position.copy(ball.a);ball.m.visible=true;player.userData.throwT=.35;beep(420,.16,'sine',.05,2.4);}
function ballUpdate(dt){if(!ball.ph)return;const d=ball.dog;if(!d||!dogsW.includes(d)||driving||inHome)return ballReset();ball.t+=dt;const m=ball.m;
  if(ball.ph==='fly'){const u=Math.min(1,ball.t/.85);m.position.lerpVectors(ball.a,ball.b,u);m.position.y+=Math.sin(u*Math.PI)*3.4;m.rotation.x+=dt*14;
    if(u>=1){ball.ph='ground';ball.t=0;beep(900,.06,'sine',.04,.6);}}
  else if(ball.ph==='ground'){m.position.y=.24+Math.abs(Math.sin(ball.t*9))*.45*Math.max(0,1-ball.t*1.4);}
  else if(ball.ph==='carry'){d.g.updateMatrixWorld(true);d.head.localToWorld(m.position.set(0,d.tier===1?-.2:-.14,d.tier===1?.72:.5));}}
// steer the fetching dog; returns its speed so the walk animation can use it
function fetchMove(d,dt){const p=d.g.position,P=player.position;d.fetchT+=dt;const back=ball.ph==='carry',tg=back?P:ball.b;
  let dx=tg.x-p.x,dz=tg.z-p.z,dist=Math.hypot(dx,dz),v=0;const stop=back?1.7:.6;
  if(dist>stop){v=Math.min(11,(dist-stop)*5+3);p.x+=dx/dist*v*dt;p.z+=dz/dist*v*dt;collide(p,.4);turnTo(d.g,dx,dz,dt*10);}
  if(ball.ph==='ground'&&(dist<1||d.fetchT>9)){if(dist>=1)p.set(ball.b.x-dx/dist*.6,0,ball.b.z-dz/dist*.6);ball.ph='carry';ball.t=0;d.fetchT=0;bark();}
  else if(back&&(dist<2||d.fetchT>14))fetchDone(d);
  return v;}
function fetchDone(d){ballReset();S.st.fetch++;earn(2);addJoy(S.dogs[d.idx],5);coinSnd();hearts(d.g.position.clone().setY(2));d.jump=1;floatText('+2',d.g.position);
  toast(['Good catch, ','Nice fetch, ','Woohoo, ','Great job, '][S.st.fetch%4]+d.name+'!');refreshHUD();}
function turnTo(g,dx,dz,k){let da=Math.atan2(dx,dz)-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*Math.min(1,k);}

/* ---------- sniff and dig ---------- */
// Hidden treasure patches. When you walk near one with an ESSA, the ESSA runs over and sniffs, and the patch sparkles. Tap Dig.
const digs=[],DIG_N=9,DIG_SEE=11;
function placeDig(s){for(let i=0;i<60;i++){const p=randPos(2.5,WB-6);if(onRoad(p.x,p.z,2)||Math.hypot(p.x,p.z-18)<16||Math.hypot(p.x-HOME.x,p.z-HOME.z)<10)continue;s.x=p.x;s.z=p.z;break;}
  s.g.position.set(s.x,0,s.z);s.g.visible=false;s.found=false;s.on=true;}
function buildDigs(){const dirt=mat(0x8a5a3c,{flat:true}),peb=mat(0xb89a7a,{flat:true});
  for(let i=0;i<DIG_N;i++){const g=new THREE.Group();scene.add(g);mesh(new THREE.SphereGeometry(.75,12,8),dirt,0,0,0,g,false).scale.set(1,.26,1);
    for(const [x,z] of[[.5,.3],[-.45,.4],[.1,-.55]])mesh(new THREE.IcosahedronGeometry(.11,0),peb,x,.08,z,g,false);
    const sp=sprite('✦',{w:96,h:96,size:84,fg:'#ffe14d',stroke:'#fff'});sp.scale.set(.9,.9,1);sp.position.y=1.2;g.add(sp);
    const s={g,sp,x:0,z:0,ph:i};placeDig(s);digs.push(s);}}
function digUpdate(dt,P){const sniffers=driving||inHome||photo||PG?[]:dogsW.filter(d=>!d.fetching);
  for(const s of digs){if(!s.on){if(clock>s.back)placeDig(s);continue;}
    const d2=(P.x-s.x)**2+(P.z-s.z)**2;
    if(!s.found&&sniffers.length&&d2<DIG_SEE*DIG_SEE){const d=sniffers.find(x=>!x.sniff)||sniffers[0];s.found=true;s.g.visible=true;d.sniff=s;bark();
      toast(S.st.dig?`${d.name} smells something! Tap Dig.`:`${d.name} smells buried treasure! Walk over and tap Dig.`);}
    if(s.found){s.sp.position.y=1.2+Math.sin(clock*3+s.ph)*.15;const k=.75+Math.abs(Math.sin(clock*4+s.ph))*.35;s.sp.scale.set(k,k,1);}}
  for(const d of dogsW)if(d.sniff&&(!d.sniff.on||(P.x-d.sniff.x)**2+(P.z-d.sniff.z)**2>18*18))d.sniff=null;}
function sniffMove(d,dt){const p=d.g.position,s=d.sniff,dx=s.x+.9-p.x,dz=s.z-p.z,dist=Math.hypot(dx,dz);let v=0;
  if(dist>.4){v=Math.min(10,dist*4+2);p.x+=dx/dist*v*dt;p.z+=dz/dist*v*dt;collide(p,.4);turnTo(d.g,dx,dz,dt*8);}else turnTo(d.g,s.x-p.x,s.z-p.z,dt*6);
  return v;}
function digAt(s){if(!s.on)return;s.on=false;s.back=clock+25;s.g.visible=false;S.st.dig++;
  const d=dogsW.find(x=>x.sniff===s)||dogsW[0];dogsW.forEach(x=>{if(x.sniff===s)x.sniff=null;});if(d)d.jump=1;
  const at=new THREE.Vector3(s.x,.6,s.z);burst(at,40,[0x8a5a3c,0x6b4220,0xb89a7a,0x7cc45a]);if(SET.sound&&ac&&musicBus())thump(.4);
  const left=DIG_GEAR.filter(id=>!owns(id)),r=Math.random();
  // the third dig always finds a secret treasure, so new players learn they exist
  if(left.length&&(r<.12||(S.st.dig===3&&left.length===DIG_GEAR.length))){const id=left[Math.floor(Math.random()*left.length)];giveGear(id,false);
    jingle();burst(at.setY(1.5),70);save();refreshHUD();return openTreasure(id,d);}
  const n=r<.3?25:[8,10,12][Math.floor(Math.random()*3)];earn(n);coinSnd();setTimeout(coinSnd,120);floatText('+'+n,at);
  toast(n>=25?`A treasure chest! ${d?d.name+' found':'You found'} 25 paw coins!`:`${d?d.name+' dug up':'You dug up'} ${n} paw coins!`);save();refreshHUD();}
let treasureDog=null;
function openTreasure(id,d){const G=GEAR[id],type=d?d.type:pvDogType(),n=DIG_GEAR.filter(owns).length;treasureDog=d?d.idx:null;
  openSheet(`<div class="tag">Secret treasure ${n} of ${DIG_GEAR.length}</div><h2>${d?esc(d.name)+' found treasure!':'You found treasure!'}</h2><div class="pvbox"></div>
    <div class="card"><div class="tag">${SLOTNAME[G.slot]}</div><h3>${G.name}</h3><p>${G.desc}</p></div>
    <div class="row">${S.dogs.length?'<button class="btn" data-act="wearTreasure" data-arg="'+id+'">Put it on</button>':''}<button class="btn alt" data-act="close">Keep it</button></div>`,'shop');
  pvShow('t:'+type+':'+id,()=>{const dd=buildDog(type);if(G.slot==='leash'){dressWith(dd,{neck:'collar_pink'});leashPreview(dd,G);}else dressWith(dd,{[G.slot]:id});return dd;},1.1);mountBox();}


/* ---------- Trick Show (Sunny Hills) ---------- */
// A copy-the-tricks memory game: Ms. Twinkle shows a line of tricks, then you tap them back in the same order.
const TRICKS=[['spin','🌀 Spin',523],['jump','⬆️ Jump',659],['sit','🐾 Sit',784],['wave','👋 Wave',988]],TS_MAX=8;let TS=null;
const tsDog=()=>S.dogs.find(x=>x.out!==false);
function openTrickShow(){const info=tsDog();
  if(!info)return openSheet(`<div class="tag">Ms. Twinkle</div><h2>The Sunny Hills Trick Show</h2><p>${S.dogs.length?'Bring an ESSA along from your toy box to join the show!':'Every ESSA can be a star! Come back when you have a plush pup.'}</p><div class="row"><button class="btn" data-act="close">OK</button></div>`);
  openSheet(`<div class="tag">Ms. Twinkle</div><h2>The Sunny Hills Trick Show</h2><p>Hello, superstar! ${esc(info.name)} will do some tricks. Watch closely, then tap the same tricks in the same order. Every round you remember earns 5 paw coins!</p>
    ${S.st.showBest?`<p class="keys">Your best show: ${S.st.showBest} of ${TS_MAX} rounds</p>`:''}<div class="row"><button class="btn" data-act="tsStart">Start the show!</button><button class="btn alt" data-act="close">Maybe later</button></div>`);}
function tsSheet(){const info=tsDog();
  openSheet(`<div class="tag">Trick Show · Round ${TS.round} of ${TS_MAX}</div><h2 id="tsMsg">Watch ${esc(info.name)}!</h2><div class="pvbox"></div>
    <div class="trks">${TRICKS.map(([k,l])=>`<button class="trk" data-act="tsTap" data-arg="${k}" disabled>${l}</button>`).join('')}</div>
    <p class="keys">Coins so far: ${(TS.round-1)*5}</p>`,'shop');
  pvShow('ts:'+TS.id+':'+TS.round,()=>{const d=buildDog(info.type);dressWith(d,info.gear||{});return d;},1);mountBox();PV.still=true;PV.dog.g.rotation.y=.45;}
const tsBtn=k=>sheet.querySelector(`.trk[data-arg="${k}"]`);
function tsDo(k){const B=tsBtn(k),T=TRICKS.find(t=>t[0]===k);if(B){B.classList.add('lit');setTimeout(()=>B.classList.remove('lit'),520);}if(PV)PV.trick={k,t:0};
  if(SET.sound){audio();if(ac&&musicBus())pluck(Math.round(69+12*Math.log2(T[2]/440)),.07,.8);}}
function tsPlay(){const id=TS.id,round=TS.round;TS.ph='watch';TS.i=0;
  TS.seq.forEach((k,i)=>setTimeout(()=>{if(TS&&TS.id===id&&TS.round===round&&!wrap.hidden)tsDo(k);},700+i*850));
  setTimeout(()=>{if(!TS||TS.id!==id||TS.round!==round||wrap.hidden)return;TS.ph='you';$('tsMsg').textContent='Your turn!';sheet.querySelectorAll('.trk').forEach(b=>b.disabled=false);},700+TS.seq.length*850);}
function tsEnd(win){const done=TS.round-1+(win?1:0),c=done*5+(win?20:0);TS.ph='over';S.st.shows++;if(done>S.st.showBest)S.st.showBest=done;if(c)earn(c);save();
  const info=tsDog();sheet.querySelectorAll('.trk').forEach(b=>b.disabled=true);
  if(win){jingle();setTimeout(jingle,450);burst(player.position.clone().setY(2),80);}
  openSheet(`<div class="tag">Trick Show</div><h2>${win?'A perfect show!':done?'Take a bow!':'Oops!'}</h2>
    <p>${win?`${esc(info?info.name:'Your ESSA')} did all ${TS_MAX} rounds! The crowd goes wild. You earned ${c} paw coins, with a 20 coin superstar bonus.`:done?`You remembered ${done} round${done>1?'s':''} and earned ${c} paw coins. Great show!`:'That was a tricky one. Try again!'}</p>
    <p class="keys">Best show: ${S.st.showBest} of ${TS_MAX} rounds</p><div class="row"><button class="btn" data-act="tsStart">Play again</button><button class="btn alt" data-act="close">Done</button></div>`);
  TS=null;refreshHUD();}
const TS_ACTS={
  tsStart:()=>{if(!tsDog())return openTrickShow();TS={id:Math.random(),round:1,seq:[TRICKS[Math.floor(Math.random()*4)][0]],ph:'watch',i:0};tsSheet();tsPlay();},
  tsTap:k=>{if(!TS||TS.ph!=='you')return;tsDo(k);
    if(k!==TS.seq[TS.i]){TS.ph='over';const B=tsBtn(k);if(B)B.classList.add('bad');$('tsMsg').textContent='Oops!';beep(220,.3,'triangle',.06,.7);setTimeout(()=>{if(TS)tsEnd(false);},900);return;}
    TS.i++;if(TS.i<TS.seq.length)return;
    TS.ph='wait';if(TS.round>=TS_MAX){setTimeout(()=>{if(TS)tsEnd(true);},700);return;}
    $('tsMsg').textContent=['Great!','Wonderful!','Amazing!','Super!'][TS.round%4];coinSnd();
    setTimeout(()=>{if(!TS||wrap.hidden)return;TS.round++;TS.seq.push(TRICKS[Math.floor(Math.random()*4)][0]);tsSheet();tsPlay();},900);}
};

/* ---------- pet care: brushing, baths and treats fill each ESSA's hearts ---------- */
// joy is 0-100 (5 hearts). It drifts down slowly while you play; hugs, fetch, care and bedtime fill it back up.
const CARE={brush:{ic:'🪮',l:'Brush',taps:6,joy:15,wait:120,fx:'✨',go:'Brush, brush!',msg:n=>`${n} is soft and shiny!`},
  bath:{ic:'🛁',l:'Bath',taps:8,joy:25,wait:300,fx:'🫧',go:'Scrub-a-dub!',msg:n=>`${n} is squeaky clean!`},
  treat:{ic:'🦴',l:'Treat',taps:1,joy:20,wait:90,cost:2,fx:'💖',go:'Yum!',msg:n=>`${n} loved the treat!`}};
let careI=0,careK=null,careN=0;const sadSaid={};
const heartsTxt=j=>{const n=Math.round((j??70)/20);return'♥'.repeat(n)+'♡'.repeat(5-n);};
function addJoy(info,n){if(!info)return;const was=info.joy??70;info.joy=Math.max(0,Math.min(100,was+n));
  if(was<100&&info.joy>=100&&n>0){earn(10);toast(`${info.name} is super happy! +10 paw coins`);jingle();}}
const careLeft=(info,k)=>Math.max(0,Math.ceil(CARE[k].wait-(Date.now()-((info.care&&info.care[k])||0))/1000));
const fmtWait=s=>s>=60?`ready in ${Math.ceil(s/60)} min`:`ready in ${s}s`;
function openCare(i){if(i!=null&&+i!==careI){careI=+i;careK=null;}const info=S.dogs[careI];if(!info)return openBox();info.care=info.care||{};
  openSheet(`<div class="tag">Care · ${DOGS[info.type].label}</div><h2>${esc(info.name)}</h2><div class="pvbox"><div class="fxl" id="careFx"></div></div>
    <p class="hearts" aria-label="${Math.round(info.joy??70)} percent happy">${heartsTxt(info.joy)}</p>
    <p class="keys" id="careMsg">${careK?`${CARE[careK].go} Keep tapping ${CARE[careK].l}.`:'Brush, bathe and give treats to fill up the hearts. Happy ESSAs wag extra fast!'}</p>
    <div class="trks">${Object.entries(CARE).map(([k,c])=>{const w=careK===k?0:careLeft(info,k);
      return`<button class="trk" data-act="care" data-arg="${k}" ${w?'disabled':''}>${c.ic} ${c.l}${c.cost?` · ${c.cost} coins`:''}${w?`<small>${fmtWait(w)}</small>`:''}</button>`;}).join('')}</div>
    <div class="row"><button class="btn alt" data-act="rename" data-arg="${careI}">Rename</button>${S.dogs.length>1?'<button class="btn alt" data-act="careNav" data-arg="1">Next ESSA ›</button>':''}<button class="btn" data-act="box">Done</button></div>`,'shop');
  pvShow('c:'+careI+JSON.stringify(info.gear||{}),()=>{const d=buildDog(info.type);dressWith(d,info.gear||{});return d;});mountBox();}
function careFx(e){const box=$('careFx');if(!box)return;const s=document.createElement('span');s.textContent=e;s.style.left=(15+Math.random()*70)+'%';box.appendChild(s);setTimeout(()=>s.remove(),1000);}
const CARE_ACTS={
  careOpen:i=>{careK=null;openCare(+i);},
  careNav:d=>{const n=S.dogs.length;careK=null;openCare(((careI+(+d))%n+n)%n);},
  care:k=>{const info=S.dogs[careI],c=CARE[k];if(!info||!c)return;
    if(careK!==k){if(careLeft(info,k))return;if(c.cost&&S.coins<c.cost){$('careMsg').textContent=`You need ${c.cost} paw coins for a treat. Find coins around town!`;return;}careK=k;careN=0;}
    careN++;careFx(c.fx);careFx(c.fx);if(PV){PV.still=true;PV.trick={k:k==='bath'?'spin':k==='treat'?'jump':'sit',t:0};}beep(700+careN*60,.06,'triangle',.05);
    if(careN<c.taps){$('careMsg').textContent=`${c.go} ${careN} of ${c.taps}`;return;}
    if(c.cost)S.coins-=c.cost;info.care[k]=Date.now();careK=null;S.st[k]=(S.st[k]||0)+1;addJoy(info,c.joy);bark();for(let i=0;i<4;i++)setTimeout(()=>careFx('💖'),i*120);
    $('careMsg').textContent=c.msg(info.name);save();refreshHUD();
    setTimeout(()=>{if(!wrap.hidden&&$('careFx'))keepScroll(()=>openCare());},1100);},
  rename:i=>{const info=S.dogs[+i];if(!info)return;
    openSheet(`<div class="tag">${DOGS[info.type].label}</div><h2>A new name for ${esc(info.name)}</h2><div class="pvbox"></div>
      <input type="text" id="dogName" maxlength="12" value="${esc(info.name)}" aria-label="New name">
      <div class="row"><button class="btn" data-act="renameOk" data-arg="${i}">Save name</button><button class="btn alt" data-act="careOpen" data-arg="${i}">Cancel</button></div>`);
    pvShow('c:'+i+JSON.stringify(info.gear||{}),()=>{const d=buildDog(info.type);dressWith(d,info.gear||{});return d;});mountBox();
    const el=$('dogName');el.select();el.addEventListener('keydown',e=>{if(e.key==='Enter')CARE_ACTS.renameOk(i);});},
  renameOk:i=>{const info=S.dogs[+i],el=$('dogName');if(!info||!el)return;const n=el.value.trim().slice(0,12);
    if(n&&n!==info.name){const old=info.name;info.name=n;S.st.rename++;respawnDogs();if(inHome)homeDogsBuild();save();toast(`${old} is now called ${n}!`);refreshHUD();}
    careK=null;openCare(+i);}
};
// every 10 seconds of play: hearts drift down a little, and a sad ESSA asks for some care once
function joyTick(){S.dogs.forEach((d,i)=>{d.joy=Math.max(0,(d.joy??70)-.5);
  if(d.joy<25&&!sadSaid[i]){sadSaid[i]=1;toast(`${d.name} would love some care. Open the toy box and tap Care!`);}if(d.joy>40)sadSaid[i]=0;});}

/* ---------- bedtime in the Dream Home ---------- */
let lastBed=-1e9;
const isNight=()=>{const t=dayT;return smooth(.56,.68,t)*(1-smooth(.86,.97,t))>.5;};
function sleepOn(html){const o=$('sleep');o.innerHTML=html;o.classList.add('on');}
function sleepOff(){$('sleep').classList.remove('on');}
function lullaby(){if(!SET.sound)return;audio();if(!ac||!musicBus())return;[76,79,84,79,77,76,74,72].forEach((m,i)=>setTimeout(()=>pluck(m,.05,1.6),i*400));}
function bedtime(){if(!S.dogs.length)return toast('Bring home an ESSA first!');
  const bonus=SET.daynight?isNight():clock-lastBed>300;lastBed=clock;closeSheet();paused=true;
  const names=S.dogs.map(d=>esc(d.name)),list=names.length>3?names.slice(0,3).join(', ')+' and everyone':names.length>1?names.slice(0,-1).join(', ')+' and '+names[names.length-1]:names[0];
  sleepOn(`<div><div class="zz">💤</div><b>Goodnight, ${list}!</b><small>Sweet dreams…</small></div>`);lullaby();
  setTimeout(()=>{if(SET.daynight)dayT=.03;S.dogs.forEach(d=>addJoy(d,25));let c=0;if(bonus){c=Math.min(30,3*S.dogs.length);earn(c);S.st.bed++;}
    sleepOff();paused=!wrap.hidden||mode!=='play';homeDogs.forEach(d=>d.jump=1);
    toast(bonus?`Good morning! Everyone slept so well. +${c} paw coins`:'What a cozy nap! The bedtime bonus comes when the stars are out.');save();refreshHUD();},3800);}

/* ---------- photo mode ---------- */
// Your character turns to face the camera, the ESSAs line up beside you, and Snap saves a framed picture.
let photo=null,lastPhoto=null;const POSES=[['wave','Wave'],['cheer','Cheer'],['hug','Big hug'],['dance','Dance']];
function enterPhoto(){if(mode!=='play'||driving||ride||!wrap.hidden||photo||PG)return;audio();photo={pose:0,z:camZoom,p:camPitch};camZoom=inHome?.6:.42;camPitch=.3;camYaw=player.rotation.y;
  document.body.classList.add('photo');$('photoUi').hidden=false;poseLbl();dogsW.forEach(d=>d.jump=1);}
function exitPhoto(){if(!photo)return;camZoom=photo.z;camPitch=photo.p;photo=null;document.body.classList.remove('photo');$('photoUi').hidden=true;
  player.userData.arms.forEach(a=>{a.rotation.z=0;});}
function poseLbl(){$('poseBtn').textContent='Pose: '+POSES[photo.pose][1];}
function photoSlot(i,P,a){const f=[[1.5,.7],[-1.5,.7],[2.8,.1],[-2.8,.1]][i]||[0,1.5],c=Math.cos(a),s=Math.sin(a);return{x:P.x+f[0]*c+f[1]*s,z:P.z-f[0]*s+f[1]*c};}
function photoPose(){const U=player.userData,[L,R]=U.arms,k=POSES[photo.pose][0],t=clock;L.rotation.x=R.rotation.x=0;L.rotation.z=R.rotation.z=0;player.position.y=0;
  U.legs[0].rotation.x=U.legs[1].rotation.x=0;
  if(k==='wave'){R.rotation.z=2.5+Math.sin(t*9)*.35;}
  else if(k==='cheer'){L.rotation.z=-2.7;R.rotation.z=2.7;player.position.y=Math.abs(Math.sin(t*5))*.18;}
  else if(k==='hug'){L.rotation.x=R.rotation.x=-1.35;L.rotation.z=.35;R.rotation.z=-.35;}
  else{const w=Math.sin(t*6);L.rotation.z=-1.2-w*.8;R.rotation.z=1.2-w*.8;U.legs[0].rotation.x=w*.4;U.legs[1].rotation.x=-w*.4;player.position.y=Math.abs(w)*.1;}}
function snapPhoto(){if(!photo)return;renderer.render(scene,camera);let src;try{src=renderer.domElement.toDataURL('image/jpeg',.92);}catch(e){return toast('This browser will not let the game take pictures.');}
  const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');

function intro(){openSheet(`<div class="tag">How to play</div><h2>Puppy Quest</h2>
  <p>Collect gold paw coins and buy ESSAs (emotional support stuffed animals) from three stores. Each store's plush dog is more realistic than the last. Help the neighbors to win gear for your pups. Can you win Best in Show?</p>
  <p class="keys">Walk with the left joystick. Turn the camera with the purple eye joystick, or drag on the town. On a keyboard use WASD to walk and Q/E to turn. Tap the yellow button to shop, talk and hug your ESSA. Tap the goal box at the top to make it small, and tap it again to see it.</p>
  <p class="keys">Tap the pink ball button to play fetch (or press T). When your ESSA sniffs out a sparkly patch, walk over and tap Dig for buried treasure. There are 5 secret treasures to find!</p>
  <p class="keys">Earn stickers for hugs, fetch, digging, helping neighbors and more. Each sticker gives paw coins. Find your sticker book in the pause menu.</p>
  <p class="keys">Save up paw coins in the Wish Jar by the fountain. Every town wish you fill builds something new: a rainbow fountain, an ice cream cart, a merry-go-round, a hot air balloon and a golden statue of your ESSA.</p>
  <p class="keys">Fetch &amp; Fancy sells accessories. Tap Dress up in the toy box to change what each ESSA wears, and use My look in the pause menu to change your character.</p>
  <p class="keys">Every store has its own ESSAs. Use the arrows to look at each one before you buy. Your ESSAs live in the toy box, where you pick who comes along.</p>
  <p class="keys">Save up for the Dream Home on Meadow Ln (the heart on the map). Inside, buy furniture from the catalog by the door, tap Move to carry furniture to a new spot, and pick your wallpaper and floor.</p>
  <p class="keys">Tap Care in the toy box to brush, bathe, give treats and rename your ESSAs. Happy ESSAs have full hearts. At night, walk to the pup beds in your house and tap Bedtime.</p>
  <p class="keys">Tap Photo (top left) for photo mode. Pick a pose, turn the camera, and tap the big round button to take a picture you can save.</p>
  <p class="keys">The town changes with the seasons. Each season, find 8 hidden things (like pumpkins or presents) for a special hat, and look for the seasonal item at Fetch &amp; Fancy.</p>
  <p class="keys">Visit Ranger Rae at Paw Park on Meadow Ln for the agility course, hide and seek, and balloon pop.</p>
  <p class="keys">Your game saves by itself every few seconds. You can also save from the pause menu (top right).</p>
  <div class="row"><button class="btn" data-act="${mode==='play'?'pause':'close'}">Got it</button></div>`);}
function ago(t){if(!t)return'';const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} hr ago`:`${Math.round(m/1440)} days ago`;}
function summary(i){const s=readSlot(i);if(!s)return null;

function slotList(purpose){let h=`<h2>${purpose==='new'?'Pick a save slot':'Load game'}</h2><div class="slots">`;
  for(let i=1;i<=SLOTS;i++){const x=summary(i);let b='';
    if(purpose==='new')b=x?`<button class="btn warn" data-act="overwrite" data-arg="${i}">Replace</button>`:`<button class="btn" data-act="newIn" data-arg="${i}">Start here</button>`;
    else if(x)b=`<button class="btn" data-act="loadSlot" data-arg="${i}">Play</button><button class="btn alt" data-act="delSlot" data-arg="${i}">Delete</button>`;
    h+=`<div class="slot"><div class="sl-main"><div class="tag">Slot ${i}${x?' · saved '+x.when:''}</div><div class="sl-line">${x?x.line:'Empty'}</div></div><div class="row">${b}</div></div>`;}

  k.fillStyle='#a5dd7a';k.fillRect(mx_(PARK.x0),mz_(PARK.z0),(PARK.x1-PARK.x0)*MS,(PARK.z1-PARK.z0)*MS);k.fillStyle='#2f7d5b';for(const [dx,dz,rr] of[[0,2,3.2],[-3.4,-2,1.6],[-1.2,-4,1.6],[1.2,-4,1.6],[3.4,-2,1.6]]){k.beginPath();k.arc(mx_(PARK.x+dx),mz_(PARK.z+dz),rr*MS*1.3,0,7);k.fill();}
  for(const h of HOUSES){k.fillStyle='#'+h[2].toString(16).padStart(6,'0');k.fillRect(mx_(h[0]-4),mz_(h[1]-4),8*MS,8*MS);}
  const st=[['valu',-90,-35,'#1f5fbf','V'],['pawsh',0,-34,'#2f7d5b','P'],['lux',90,-34,'#2a2140','L'],['gear',-20,87,'#7b4fd6','F']];
  k.font='bold 12px Arial,sans-serif';k.textAlign='center';k.textBaseline='middle';
  for(const [,x,z,c,t] of st){k.fillStyle=c;k.fillRect(mx_(x)-8,mz_(z)-8,16,16);k.fillStyle='#fff';k.fillText(t,mx_(x),mz_(z)+1);}
  miniBase=c;}
function miniDraw(){if(!miniBase)miniBuild();mctx.drawImage(miniBase,0,0);const P=player.position;
  for(const c of cars){if(c===driving)continue;mctx.fillStyle='#fff';mctx.fillRect(mx_(c.g.position.x)-2.5,mz_(c.g.position.z)-2.5,5,5);}
  {const hx=mx_(HOME.x),hz=mz_(HOME.z);mctx.fillStyle=S.home.own?'#ff5d8f':'#ffffff';mctx.strokeStyle='#ff5d8f';mctx.lineWidth=1.5;mctx.beginPath();mctx.moveTo(hx,hz+5);mctx.bezierCurveTo(hx+8,hz-1,hx+4,hz-7,hx,hz-3);mctx.bezierCurveTo(hx-4,hz-7,hx-8,hz-1,hx,hz+5);mctx.fill();mctx.stroke();}
  for(const it of items)if(it.on&&it.kind!=='coin'&&!it.done){mctx.fillStyle=it.kind==='flag'||it.kind==='mail'?'#ffc53d':'#ff5d8f';mctx.beginPath();mctx.arc(mx_(it.x),mz_(it.z),3,0,7);mctx.fill();}
  if(curWish()){const jx=mx_(JAR.x),jz=mz_(JAR.z);mctx.fillStyle='#ffc53d';mctx.strokeStyle='#7b4fd6';mctx.lineWidth=1.5;mctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?2.6:6;mctx.lineTo(jx+Math.cos(a)*r,jz+Math.sin(a)*r);}mctx.closePath();mctx.fill();mctx.stroke();}
  mctx.fillStyle='#8a5a3c';for(const s of digs)if(s.on&&s.found){mctx.beginPath();mctx.arc(mx_(s.x),mz_(s.z),3,0,7);mctx.fill();}
  for(const id in npcs){const n=npcs[id];if(n.mk.visible){mctx.fillStyle='#ffc53d';mctx.strokeStyle='#2a2140';mctx.lineWidth=1.5;mctx.beginPath();mctx.arc(mx_(n.x),mz_(n.z),4.5,0,7);mctx.fill();mctx.stroke();}}
  const tg=goalTarget();if(tg){mctx.strokeStyle='#ff5d8f';mctx.lineWidth=2.5;mctx.beginPath();mctx.arc(mx_(tg.x),mz_(tg.z),7+Math.sin(clock*6)*1.5,0,7);mctx.stroke();}
  mctx.save();mctx.translate(mx_(P.x),mz_(P.z));mctx.rotate(-player.rotation.y+Math.PI);mctx.fillStyle='#ff5d8f';mctx.strokeStyle='#fff';mctx.lineWidth=2;
  mctx.beginPath();mctx.moveTo(0,-7);mctx.lineTo(5,5);mctx.lineTo(0,2.5);mctx.lineTo(-5,5);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();}
