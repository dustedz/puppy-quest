name: Release APK

# Change the number in VERSION and push to main to build a signed APK and publish it as a
# GitHub Release. Obtainium watches these releases and offers the update on the phone.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless aapt apksigner zipalign dalvik-exchange android-sdk-platform-23 zip unzip

      - name: Read version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          # Re-running for a version that is already released rebuilds the Play bundle only.
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::notice::Release v$V already exists, so only the Play bundle is rebuilt. Raise VERSION for a new release."
            echo "RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          # Always higher than the hand-built 1.0 (versionCode 1) and every earlier release.
          echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the SIDELOAD_KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIDELOAD_PASS: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD || 'android' }}
        run: |
          bash android/build.sh
          cp android/out/puppy-quest-debug.apk "puppy-quest-$VERSION_NAME.apk"

      - name: Publish release
        if: env.RELEASE_EXISTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "puppy-quest-$VERSION_NAME.apk" --target "$GITHUB_SHA" \
            --title "Puppy Quest $VERSION_NAME" --generate-notes

      - name: Sign the Play Store bundle
        env:
          UPLOAD_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS || 'upload' }}
        run: |
          AAB="puppy-quest-$VERSION_NAME-play.aab"
          if [ -z "$UPLOAD_B64" ]; then
            echo "::warning::No PLAY_UPLOAD_KEYSTORE_BASE64 secret, so the Play bundle is left unsigned."
            cp android/out/puppy-quest-release-unsigned.aab "puppy-quest-$VERSION_NAME-play-unsigned.aab"
            exit 0
          fi
          if [ -z "$UPLOAD_PASS" ]; then
            echo "::error::Add the PLAY_UPLOAD_KEYSTORE_PASSWORD secret (and PLAY_UPLOAD_KEY_ALIAS if the alias isn't 'upload')."
            exit 1
          fi
          # Tolerate Windows line breaks or spaces picked up when the secret was pasted.
          printf '%s' "$UPLOAD_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_PASS="$(printf '%s' "$UPLOAD_PASS" | tr -d '\r\n')"
          UPLOAD_ALIAS="$(printf '%s' "$UPLOAD_ALIAS" | tr -d ' \r\n')"
          echo "Upload key file: $(stat -c %s "$RUNNER_TEMP/upload.jks") bytes, starts $(head -c 4 "$RUNNER_TEMP/upload.jks" | od -An -tx1 | tr -d ' '); password ${#UPLOAD_PASS} characters"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_PASS" > "$RUNNER_TEMP/kl.txt" 2>&1; then
            echo "::error::Could not open the upload key: $(grep -v JAVA_TOOL "$RUNNER_TEMP/kl.txt" | head -3 | tr '\n' ' ')"
            exit 1
          fi
          grep -iE "keystore type|entries|PrivateKeyEntry" "$RUNNER_TEMP/kl.txt" | sed 's/,.*//' || true
          cp android/out/puppy-quest-release-unsigned.aab "$AAB"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$UPLOAD_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$UPLOAD_ALIAS"
          jarsigner -verify "$AAB"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: puppy-quest-${{ env.VERSION_NAME }}-play-bundle
          path: puppy-quest-*.aab
