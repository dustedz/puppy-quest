name: Release APK

# Push a tag like v1.0.1 to build a signed APK and publish it as a GitHub Release.
# Obtainium watches these releases and offers the update on the phone.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless aapt apksigner zipalign dalvik-exchange android-sdk-platform-23 zip unzip

      - name: Set version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # Always higher than the hand-built 1.0 (versionCode 1) and every earlier release.
          echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the SIDELOAD_KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.keystore"
          echo "SIDELOAD_KEYSTORE=$RUNNER_TEMP/sideload.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIDELOAD_PASS: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD || 'android' }}
        run: |
          bash android/build.sh
          cp android/out/puppy-quest-debug.apk "puppy-quest-$VERSION_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "puppy-quest-$VERSION_NAME.apk" \
            --title "Puppy Quest $VERSION_NAME" --generate-notes

      - name: Keep the Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: puppy-quest-${{ env.VERSION_NAME }}-play-bundle-unsigned
          path: android/out/puppy-quest-release-unsigned.aab
